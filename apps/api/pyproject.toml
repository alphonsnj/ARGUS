[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-api"
version = "0.1.0"
description = "ARGUS investigation intelligence platform API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "Pillow>=12.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6.16.1,<7",
  "PyJWT>=2.10,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1"
]

[dependency-groups]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6.0,<7", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "pytesseract"]
ignore_missing_imports = true
