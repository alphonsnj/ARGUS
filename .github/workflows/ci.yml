name: Continuous integration

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  recovery:
    name: Isolated backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env
      - run: docker build -t argus-api apps/api
      - run: node scripts/qa-backup.mjs

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build --workspace=@argus/web
      - run: npm run typecheck
      - run: node scripts/qa-auth-client.mjs

  api:
    name: API quality
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps .
      - run: pip install --group dev
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --disable-pip
      - run: cp ../../.env.example .env
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
